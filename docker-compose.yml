version: '3.8'

services:
  bot:
    build: .
    command: python -m bot.main
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-education_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-education_pass}
      POSTGRES_DB: ${DB_NAME:-education_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: